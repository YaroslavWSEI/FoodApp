<div class="container mt-4">
  <div class="d-flex justify-content-between align-items-center mb-3">
    <h2>Użytkownicy</h2>
    <a routerLink="/admin/users/new" class="btn btn-success">+ Nowy Admin</a>
  </div>
  <div class="mb-3">
    <input class="form-control" placeholder="Szukaj po imieniu lub e-mailu..." [ngModel]="searchTerm()" (ngModelChange)="searchTerm.set($event)" />
  </div>
  <table class="table table-bordered table-hover">
    <thead class="table-dark">
      <tr>
        <th>Imię</th>
        <th>E-mail</th>
        <th>Rola</th>
        <th>Telefon</th>
        <th>Akcje</th>
      </tr>
    </thead>
    <tbody>
      @for (user of filteredUsers(); track user.id) {
        <tr>
          <td>{{ user.name }}</td>
          <td>{{ user.email }}</td>
          <td><span class="badge" [class.bg-danger]="user.role === 'admin'" [class.bg-primary]="user.role === 'customer'">{{ user.role }}</span></td>
          <td>{{ user.phone || '—' }}</td>
          <td>
            <button class="btn btn-sm btn-warning me-1" (click)="onResetPassword(user.id, user.name)">Reset hasła</button>
            <button class="btn btn-sm btn-danger" (click)="onDelete(user.id, user.name)">Usuń</button>
          </td>
        </tr>
      }
      @if (filteredUsers().length === 0) {
        <tr><td colspan="5" class="text-center text-muted">Brak użytkowników.</td></tr>
      }
    </tbody>
  </table>
</div>
