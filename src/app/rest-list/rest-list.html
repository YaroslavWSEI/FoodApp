<div class="container mt-4">
  <h2 class="mb-3">Restauracje</h2>

  <section class="filters mb-3 d-flex flex-wrap gap-2 align-items-center">
    <input type="text" class="form-control w-auto" placeholder="Szukaj..." [value]="searchTerm()" (input)="onSearch($event)" />

    <select class="form-select w-auto" [value]="selectedCuisine()" (change)="onCuisineChange($event)">
      @for (cuisine of cuisines(); track cuisine) {
        <option [value]="cuisine">{{ cuisine === 'All' ? 'Wszystkie' : cuisine }}</option>
      }
    </select>

    <label class="d-flex align-items-center gap-1">
      <input type="checkbox" [checked]="onlyActive()" (change)="onStatusChange($event)" /> Czynne teraz
    </label>

    <select class="form-select w-auto" [value]="selectedSort()" (change)="onSortChange($event)">
      <option value="rating">Rating</option>
      <option value="deliveryTime">Czas dostawy</option>
      <option value="deliveryFee">Koszt dostawy</option>
    </select>

    <button class="btn btn-outline-secondary btn-sm" (click)="resetFilters()">Reset</button>
  </section>

  <app-state-view
    [status]="stateStatus"
    [isEmpty]="filteredRestaurants().length === 0 && state().status === 'success'"
    emptyMessage="Nie znaleziono restauracji."
    (retry)="load()"
  />

  @if (state().status === 'success') {
    <section class="list">
      @for (restaurant of filteredRestaurants(); track restaurant.id) {
        <app-rest-card [restaurant]="restaurant" />
      }
    </section>
  }
</div>
