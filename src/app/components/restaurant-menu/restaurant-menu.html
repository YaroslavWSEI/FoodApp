<div class="menu-container mt-3">
  <h3>Menu</h3>
  <app-state-view
    [status]="stateStatus"
    [isEmpty]="isEmpty"
    emptyMessage="Brak produktów w menu."
    (retry)="load()"
  />
  @for (cat of menuCategories(); track cat.category) {
    <section class="menu-section">
      <h4 class="border-bottom pb-1 mt-3">{{ cat.category }}</h4>
      <div class="product-grid d-flex flex-column gap-3 mt-3">
        @for (prod of cat.products; track prod.id) {
          <app-restaurant-menu-product [product]="prod" />
        }
      </div>
    </section>
  }
</div>
