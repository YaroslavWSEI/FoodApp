<div class="container mt-4">
  <app-state-view [status]="stateStatus" (retry)="load()" />

  @if (restaurant; as rest) {
    <section class="card p-3">
      <img class="restaurant-image mb-3" [src]="rest.imageUrl" [alt]="rest.name" style="max-height:220px;object-fit:cover;border-radius:8px" />
      <h2>{{ rest.name }}</h2>
      <p>{{ rest.description }}</p>
      <div class="d-flex flex-wrap gap-3 text-muted small mb-3">
        <span>⭐ {{ rest.rating }}</span>
        <span>🕐 {{ rest.deliveryTimeMin }}–{{ rest.deliveryTimeMax }} min</span>
        <span>🚚 {{ rest.deliveryFee | currency:'PLN' }}</span>
        <span>Kuchnia: {{ rest.cuisine }}</span>
        <span [class]="rest.isActive ? 'text-success' : 'text-danger'">{{ rest.isActive ? 'Otwarte' : 'Zamknięte' }}</span>
      </div>
      <app-restaurant-menu [id]="rest.id" />
    </section>
  }
</div>
