<div class="product-card" [ngClass]="{'is-unavailable': !product().isActive}">
  
  <div class="product-info">
    <h4>{{ product().name }}</h4>
    <p class="desc">{{ product().description }}</p>
    <div class="price-action">
      <span class="price">{{ product().price | currency:'PLN' }}</span>
      <button (click)="addToCart()" [disabled]="!product().isActive">
        {{ product().isActive ? 'Add to cart' : 'Niedostępny' }}
      </button>
    </div>
  </div>
  <img [src]="product().imageUrl" [alt]="product().name" />
</div>
